name: Build Mobile App

on:
  workflow_dispatch:
    inputs:
      org_slug:
        description: "Conference org slug to build for"
        required: true
        type: string
      dry_run:
        description: "If true, builds + stores APK but does NOT update the org's mobile_app_url"
        type: boolean
        default: false

# Prevent two builds for the same org from racing each other
concurrency:
  group: mobile-build-${{ inputs.org_slug }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out code
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 1.1. Decode signing keystore (must happen before any build step)
      # -----------------------------------------------------------------------
      - name: Decode Android signing keystore
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > Mobile/android/app/upload-keystore.jks
          echo "Keystore decoded to Mobile/android/app/upload-keystore.jks"

      # -----------------------------------------------------------------------
      # 2. Fetch live branding from the database (not from client payload)
      # -----------------------------------------------------------------------
      - name: Fetch org branding from Supabase
        id: branding
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ORG_SLUG: ${{ inputs.org_slug }}
        run: |
          RESPONSE=$(curl -s --fail \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            "$SUPABASE_URL/rest/v1/organizations?slug=eq.$ORG_SLUG&select=name,logo_url,schema_name,build_number" \
          )

          echo "Branding response: $RESPONSE"
          APP_NAME=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['name'])" 2>/dev/null) || APP_NAME=""
          LOGO_URL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('logo_url',''))" 2>/dev/null) || LOGO_URL=""
          SCHEMA_NAME=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['schema_name'])" 2>/dev/null) || SCHEMA_NAME=""

          # Fetch themeColor via RPC (avoids direct tenant schema access)
          THEME_COLOR=$(curl -s --fail \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"p_schema_name\":\"$SCHEMA_NAME\"}" \
            "$SUPABASE_URL/rest/v1/rpc/get_org_theme_color" \
          ) && THEME_COLOR=$(printf '%s' "$THEME_COLOR" | python3 -c "import sys; print(sys.stdin.read().strip().strip('\"'))" 2>/dev/null) || THEME_COLOR="#0D7E52"

          # Fetch current build_number so we can increment it
          BUILD_NUMBER=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)[0].get('build_number',0))" 2>/dev/null || echo "0")
          NEXT_BUILD=$((BUILD_NUMBER + 1))

          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "logo_url=$LOGO_URL" >> $GITHUB_OUTPUT
          echo "theme_color=$THEME_COLOR" >> $GITHUB_OUTPUT
          echo "schema_name=$SCHEMA_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$NEXT_BUILD" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # 3. Generate mobile_config.dart with org-specific branding
      # -----------------------------------------------------------------------
      - name: Generate mobile_config.dart
        env:
          APP_NAME: ${{ steps.branding.outputs.app_name }}
          LOGO_URL: ${{ steps.branding.outputs.logo_url }}
          THEME_COLOR: ${{ steps.branding.outputs.theme_color }}
          ORG_SLUG: ${{ inputs.org_slug }}
        run: |
          HEX="${THEME_COLOR#\#}"
          FLUTTER_COLOR="0xFF${HEX^^}"

          cat > Mobile/lib/mobile_config.dart << EOF
          // Auto-generated by GitHub Actions — do not edit manually.
          // Generated for org: $ORG_SLUG
          class MobileConfig {
            static const String appName = '$APP_NAME';
            static const String orgSlug = '$ORG_SLUG';
            static const String themeColor = '$FLUTTER_COLOR';
            static const String logoUrl = '$LOGO_URL';

            static const String heroTitle = 'Conference';
            static const String heroSubtitle = 'A premium conference experience for every attendee.';
            static const String conferenceDates = '';
            static const String location = '';
            static const String conferenceDescription = '$APP_NAME — powered by ElMoultaqa.';
            static const String liveStreamUrl = '';
            static const int participants = 0;

            static const String authWelcome = 'Welcome back';
            static const String authRegister = 'Create an account';

            static const List<Map<String, String>> upcomingSessions = [];
            static const List<Map<String, String>> notifications = [];
            static const List<Map<String, dynamic>> scheduleDays = [];
          }
          EOF

          echo "Generated mobile_config.dart:"
          cat Mobile/lib/mobile_config.dart

      # -----------------------------------------------------------------------
      # 3.5. Customize Android App Label and Launcher Icon
      # -----------------------------------------------------------------------
      - name: Customize Android App Name & Icons
        env:
          APP_NAME: ${{ steps.branding.outputs.app_name }}
          LOGO_URL: ${{ steps.branding.outputs.logo_url }}
        run: |
          RAW_APP_NAME="${APP_NAME:-Conference}"
          SAFE_APP_NAME=$(echo "$RAW_APP_NAME" | sed 's/"/\\"/g')
          sed -i "s/android:label=\"elmoultaqa_mobile\"/android:label=\"$SAFE_APP_NAME\"/g" Mobile/android/app/src/main/AndroidManifest.xml

          if [ -n "$LOGO_URL" ]; then
            echo "Downloading logo from $LOGO_URL"
            if curl -s -L --fail "$LOGO_URL" -o temp_logo.png; then
              if file temp_logo.png | grep -qE 'image|data'; then
                echo "Logo downloaded successfully. Generating mipmap icons..."
                mkdir -p Mobile/android/app/src/main/res/mipmap-mdpi
                mkdir -p Mobile/android/app/src/main/res/mipmap-hdpi
                mkdir -p Mobile/android/app/src/main/res/mipmap-xhdpi
                mkdir -p Mobile/android/app/src/main/res/mipmap-xxhdpi
                mkdir -p Mobile/android/app/src/main/res/mipmap-xxxhdpi
                convert temp_logo.png -resize 48x48 Mobile/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
                convert temp_logo.png -resize 72x72 Mobile/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
                convert temp_logo.png -resize 96x96 Mobile/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
                convert temp_logo.png -resize 144x144 Mobile/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
                convert temp_logo.png -resize 192x192 Mobile/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
                echo "Launcher icons successfully generated."
              else
                echo "WARNING: Downloaded file from LOGO_URL is not a valid image. Keeping default launcher icon."
              fi
            else
              echo "WARNING: Failed to download logo from $LOGO_URL. Keeping default launcher icon."
            fi
          else
            echo "No logo_url specified for this organization. Keeping default launcher icon."
          fi

      # -----------------------------------------------------------------------
      # 4. Write .env file with backend credentials
      # -----------------------------------------------------------------------
      - name: Write .env file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          ORG_SLUG: ${{ inputs.org_slug }}
        run: |
          cat > Mobile/.env << EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY
          ORG_SLUG=$ORG_SLUG
          EOF
          echo ".env file written (keys redacted):"
          grep -o '^[^=]*' Mobile/.env

      # -----------------------------------------------------------------------
      # 5. Set up Java (required for Android builds)
      # -----------------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # -----------------------------------------------------------------------
      # 6. Set up Flutter
      # -----------------------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: "stable"

      # -----------------------------------------------------------------------
      # 7. CI fast-fail — analyze before the real build
      # -----------------------------------------------------------------------
      - name: CI fast-fail — flutter analyze + test
        working-directory: Mobile
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || exit 1
          flutter test || exit 1

      # -----------------------------------------------------------------------
      # 7.1. Install dependencies
      # -----------------------------------------------------------------------
      - name: Install Flutter dependencies
        working-directory: Mobile
        run: flutter pub get

      # -----------------------------------------------------------------------
      # 7.2. Build release APK
      # -----------------------------------------------------------------------
      - name: Build release APK
        working-directory: Mobile
        run: flutter build apk --release --no-shrink --build-number=${{ steps.branding.outputs.build_number }}
        env:
          ANDROID_KEYSTORE_PATH: android/app/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # -----------------------------------------------------------------------
      # 7.3. Verify APK signing
      # -----------------------------------------------------------------------
      - name: Verify APK signing
        working-directory: Mobile
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          echo "=== jarsigner verification ==="
          jarsigner -verify -verbose -certs "$APK" 2>&1 | head -20
          jarsigner -verify "$APK" || exit 1
          echo "=== APK signing verified ==="

      # -----------------------------------------------------------------------
      # 8. Rename APK with org slug + timestamp for uniqueness
      # -----------------------------------------------------------------------
      - name: Rename APK
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          mv Mobile/build/app/outputs/flutter-apk/app-release.apk \
             Mobile/build/app/outputs/flutter-apk/${{ inputs.org_slug }}-${TIMESTAMP}.apk
          echo "APK_NAME=${{ inputs.org_slug }}-${TIMESTAMP}.apk" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # 9. Upload APK to Supabase Storage (org-specific path, public)
      # -----------------------------------------------------------------------
      - name: Upload APK to Supabase Storage
        id: storage_upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ORG_SLUG: ${{ inputs.org_slug }}
          BUILD_NUM: ${{ steps.branding.outputs.build_number }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            PREFIX="test-builds"
            FILENAME="$PREFIX/${{ env.APK_NAME }}"
          else
            PREFIX="mobile-apps/$ORG_SLUG"
            FILENAME="$PREFIX/app-${BUILD_NUM}.apk"
          fi

          curl -s -X POST "$SUPABASE_URL/storage/v1/object/$FILENAME" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@Mobile/build/app/outputs/flutter-apk/${{ env.APK_NAME }}"

          STORAGE_URL="$SUPABASE_URL/storage/v1/object/public/$FILENAME"
          echo "storage_url=$STORAGE_URL" >> $GITHUB_OUTPUT
          echo "APK uploaded to $STORAGE_URL"

      # -----------------------------------------------------------------------
      # 9.5. Upload APK to GitHub Release (production only — backup/audit trail)
      # -----------------------------------------------------------------------
      - name: Upload APK to GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "mobile/${{ inputs.org_slug }}-${{ github.run_number }}"
          name: "${{ steps.branding.outputs.app_name }} — Build ${{ github.run_number }}"
          body: "Automated branded APK build for **${{ inputs.org_slug }}**."
          files: "Mobile/build/app/outputs/flutter-apk/${{ env.APK_NAME }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 10. Report build result to Supabase (skip if dry_run)
      # -----------------------------------------------------------------------
      - name: Report build result to Supabase
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ORG_SLUG: ${{ inputs.org_slug }}
          STORAGE_URL: ${{ steps.storage_upload.outputs.storage_url }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          if [ "$BUILD_STATUS" = "success" ] && [ -n "$STORAGE_URL" ]; then
            curl -s --fail -X POST \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              "$SUPABASE_URL/rest/v1/rpc/set_mobile_build_result" \
              -d "{\"p_org_slug\":\"$ORG_SLUG\",\"p_success\":true,\"p_app_url\":\"$STORAGE_URL\",\"p_error\":null}"
          else
            ERROR_MSG="Build $BUILD_STATUS. Check workflow run ${{ github.run_id }} for details."
            curl -s --fail -X POST \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              "$SUPABASE_URL/rest/v1/rpc/set_mobile_build_result" \
              -d "{\"p_org_slug\":\"$ORG_SLUG\",\"p_success\":false,\"p_app_url\":null,\"p_error\":\"$ERROR_MSG\"}"
          fi
